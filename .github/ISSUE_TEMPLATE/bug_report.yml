name: Bug report
description: Something in an image, script, or doc is broken.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repo is affected?
      options:
        # BEGIN component-options
        - agent-gateway
        - claude-code
        - hermes
        - shared (egress-allowlist.sh)
        - docs/build tooling
        - other
        # END component-options
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Exact commands/flags used to build or run the image.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, Docker version, image tag or commit SHA, relevant run flags (capabilities, mounts, etc).
      placeholder: |
        Host OS:
        Docker version:
        Image tag / commit:
        Run flags:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
    validations:
      required: false
