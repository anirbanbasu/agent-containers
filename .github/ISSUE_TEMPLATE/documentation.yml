name: Documentation
description: Docs are wrong, missing, or unclear.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repo does this affect?
      options:
        # BEGIN component-options
        - adal
        - agent-gateway
        - claude-code
        - codex
        - hermes
        - kilo-code
        - opencode
        - qwen-code
        - shared (egress-allowlist.sh)
        - docs/build tooling
        - other
        # END component-options
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected page or file
      placeholder: e.g. docs/container-images/claude-code.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong, missing, or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
    validations:
      required: false
